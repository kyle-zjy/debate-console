<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>东区新生赛</title>
  <style>
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#f3f0e8;color:#242421;font-family:"Noto Serif SC","Songti SC","SimSun",serif}
    main{width:min(760px,calc(100% - 36px));text-align:center}
    nav{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    a{display:grid;place-items:center;min-height:185px;border:1px solid #b6a88e;border-radius:4px;background:#fbf8f0;color:#315f6a;text-decoration:none;font-size:clamp(2rem,5vw,3.6rem);letter-spacing:.18em;transition:transform .2s,box-shadow .2s,background .2s}
    a:last-child{color:#8a4b37}
    a:hover,a:focus-visible{transform:translateY(-3px);background:#fffdf8;box-shadow:0 14px 30px #302d271c;outline:none}
    @media(max-width:520px){nav{gap:12px}a{min-height:145px}}
  </style>
</head>
<body>
  <main>
    <nav aria-label="选择工作台">
      <a href="DQ%20Timer.html">计时</a>
      <a href="场务.html">场务</a>
    </nav>
  </main>
</body>
</html>
