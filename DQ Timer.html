<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>东区新生赛计时台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;500;600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}

:root{
  color-scheme:light;
  --paper:#F3F0E8; --paper-2:#FBF8F0; --panel:rgba(252,250,244,.68);
  --ink:#242421; --ink-2:#4D4A43; --ink-3:#7B7467; --ink-4:#AAA18F;
  --line:rgba(48,45,39,.17);
  --aff:#315F6A; --neg:#8A4B37;
  --warn:#9B6C25; --alarm:#AF3726; --seal:#9A6B2E; --seal-ink:#FFF9E9;
  --bronze:#9A6B2E; --bronze-soft:#C8AA72;
  --wash-far:rgba(37,38,35,.045); --wash-mid:rgba(37,38,35,.075); --wash-near:rgba(37,38,35,.12);
  --mist:rgba(250,248,242,.90); --moon:rgba(255,252,241,.82);
  --font-brush:"Ma Shan Zheng","Kaiti SC","STKaiti","KaiTi","楷体",serif;
  --font-serif:"Noto Serif SC","Songti SC","STSong","SimSun","宋体",Georgia,serif;
}

body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:var(--font-serif);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:1560px;margin:0 auto;padding-inline:clamp(16px,3vw,44px);padding-block:clamp(18px,3vh,34px)}
:focus-visible{outline:2px solid var(--ink-2);outline-offset:2px}

/* 卷首 */
.masthead{text-align:center;position:relative}
.masthead::after{content:"";display:block;width:min(360px,42vw);height:1px;margin:12px auto 0;background:linear-gradient(90deg,transparent,var(--bronze-soft),transparent);opacity:.72}
.title-row{display:flex;align-items:center;justify-content:center;gap:clamp(10px,1.8vw,22px);flex-wrap:wrap}
h1{margin:0;font-family:var(--font-brush);font-weight:400;font-size:clamp(2rem,6.1vw,4.45rem);line-height:1.12;letter-spacing:.055em;text-wrap:balance;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.brand-logo{flex:none;width:clamp(70px,7.6vw,104px);height:auto;filter:drop-shadow(0 4px 8px rgba(75,52,23,.12));opacity:.97}
.logo-watermark{position:fixed;right:clamp(-30px,1.2vw,18px);bottom:clamp(-48px,-1vw,-18px);z-index:0;width:clamp(230px,22vw,380px);height:auto;opacity:.055;pointer-events:none;filter:grayscale(.2)}
.kicker{margin:.55em 0 0;font-size:clamp(.7rem,1.2vw,.84rem);letter-spacing:.44em;text-indent:.44em;color:var(--ink-3)}

.motion{display:flex;align-items:center;gap:.7em;max-width:920px;margin:clamp(14px,2.4vh,22px) auto 0;
  padding:.3em .2em;border-bottom:1px solid var(--line)}
.tag{flex:none;font-size:.72rem;letter-spacing:.26em;text-indent:.26em;color:var(--ink-3);
  border:1px solid var(--line);border-radius:2px;padding:.34em .5em}
.field{font:inherit;color:inherit;background:transparent;border:0;outline:0;width:100%;padding:.22em .4em;border-radius:2px;transition:background .15s}
.field:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.field::placeholder{color:var(--ink-4)}
#motion{font-size:clamp(1rem,2.15vw,1.5rem);text-align:center;font-weight:500}

/* 对阵 */
.stage{display:grid;grid-template-columns:1fr minmax(206px,248px) 1fr;gap:clamp(10px,1.7vw,26px);align-items:stretch;margin-top:clamp(16px,2.6vh,28px)}
.side{--c:var(--ink-2);container-type:inline-size;position:relative;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.5vh,15px);
  padding:clamp(14px,2.2vw,26px) clamp(12px,2vw,24px);background:var(--panel);border:1px solid var(--line);border-radius:5px;backdrop-filter:blur(2.5px);
  transition:box-shadow .35s ease,background .35s ease}
.side[data-side="aff"]{--c:var(--aff)}
.side[data-side="neg"]{--c:var(--neg)}
.side.live{box-shadow:0 0 0 1px var(--c),0 20px 54px -30px var(--c);
  background:var(--panel);
  background:color-mix(in srgb,var(--c) 8%,var(--panel))}

.side-head{display:flex;align-items:center;justify-content:center;gap:.55em;width:100%}
.side[data-side="neg"] .side-head{flex-direction:row-reverse}
.mark{flex:none;display:grid;place-items:center;width:2.15em;height:2.15em;border:1.5px solid var(--c);border-radius:50%;
  color:var(--c);font-family:var(--font-brush);font-size:clamp(.95rem,1.55vw,1.2rem);line-height:1}
.team{font-size:clamp(1.45rem,3.4vw,2.5rem);font-weight:600;text-align:center;color:var(--c);letter-spacing:.04em}

.clockbtn{display:block;width:100%;padding:.06em .1em;border:0;border-radius:5px;background:none;color:inherit;font:inherit;cursor:pointer}
.clock{display:block;white-space:nowrap;font-weight:700;line-height:1.04;color:var(--ink);transition:color .25s;font-variant-numeric:tabular-nums;
  font-size:clamp(2.6rem,9vw,8rem);
  font-size:clamp(2.6rem,30cqi,8rem)}
.clock i{display:inline-block;width:.62em;font-style:normal;text-align:center}
.clock i.colon{width:.34em;color:var(--ink-3)}
.side.live .clock i.colon{animation:blink 1s steps(1,end) infinite}
.side.w30 .clock{color:var(--warn)}
.side.w5 .clock{color:var(--alarm);animation:throb .62s ease-in-out infinite alternate}
.side.done .clock{color:var(--alarm)}

.bar{width:100%;height:6px;border-radius:1px;overflow:hidden;
  background:var(--line);
  background:color-mix(in srgb,var(--ink) 11%,transparent)}
.bar span{display:block;height:100%;background:var(--c);transform-origin:right center;transition:transform .12s linear}
.side[data-side="neg"] .bar span{transform-origin:left center}

.status{display:flex;align-items:center;gap:.5em;font-size:.8rem;letter-spacing:.2em;text-indent:.2em;color:var(--ink-3)}
.side.live .status{color:var(--c)}
.side.done .status{color:var(--alarm)}
.time-edit{margin-top:-.2em;padding:.38em .72em;font:inherit;font-size:.76rem;color:var(--ink-3);background:transparent;border:1px solid var(--line);border-radius:3px;cursor:pointer;transition:background .15s,color .15s}
.time-edit:hover{background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.45}
.side.live .dot{opacity:1;animation:breathe 1.9s ease-in-out infinite}

.stance{width:100%;font:inherit;font-size:clamp(1rem,1.7vw,1.28rem);color:var(--ink-2);background:transparent;
  border:1px dashed var(--line);border-radius:3px;padding:.58em .72em;resize:vertical;text-align:center;line-height:1.48;outline:0;
  min-height:3.35em;max-height:8.2em;overflow-y:hidden}
.stance:hover,.stance:focus{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.stance::placeholder{color:var(--ink-4)}

/* 中轴 */
.axis{position:relative;display:flex;flex-direction:column;gap:clamp(8px,1.4vh,13px);padding:clamp(8px,1.5vw,16px) clamp(8px,1.3vw,15px)}
.axis::before,.axis::after{content:"";position:absolute;top:5%;bottom:5%;width:1px;
  background:linear-gradient(to bottom,transparent,var(--line) 16%,var(--line) 84%,transparent)}
.axis::before{left:0}
.axis::after{right:0}
.axis-title{margin:0 0 .2em;font-size:.7rem;letter-spacing:.34em;text-indent:.34em;color:var(--ink-3);text-align:center}
.pbtn{display:flex;align-items:baseline;justify-content:space-between;gap:.5em;width:100%;padding:.62em .7em;
  font:inherit;color:var(--ink-2);background:transparent;border:1px solid var(--line);border-radius:3px;cursor:pointer;text-align:left;transition:background .15s,color .15s}
.pbtn b{font-weight:600;font-size:.95rem}
.pbtn em{font-style:normal;font-size:.78rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pbtn:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.pbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper-2)}
.pbtn[aria-pressed="true"] em{color:var(--paper-2);color:color-mix(in srgb,var(--paper-2) 68%,transparent)}

.main-btn{width:100%;padding:.85em .6em;font-family:var(--font-serif);font-size:1.08rem;font-weight:600;letter-spacing:.14em;text-indent:.14em;
  color:var(--paper-2);background:var(--ink);border:1.5px solid var(--ink);border-radius:3px;cursor:pointer;transition:background .18s,color .18s,opacity .18s}
.main-btn[data-state="paused"]{background:transparent;color:var(--ink)}
.main-btn:hover{opacity:.86}
.phase-main{display:none}
.phase-main.active{display:flex}
.phase-main.row{gap:8px}
.phase-main .main-btn{flex:1}
#switch-p2{display:none}
#switch-p2.active{display:block}
#main{display:none}
#main.active{display:block}
.row{display:flex;gap:6px}
.row>*{flex:1}
.mini{padding:.55em .35em;font-family:var(--font-serif);font-size:.8rem;color:var(--ink-2);background:transparent;
  border:1px solid var(--line);border-radius:3px;cursor:pointer;transition:background .15s}
.mini:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}

/* 场中指导：第三环节仅保留一个共用计时器 */
.single-phase{display:none;--c:var(--bronze);position:relative;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,1.8vh,18px);
  min-height:100%;padding:clamp(18px,2.8vw,34px);background:var(--panel);border:1px solid var(--line);border-radius:5px;backdrop-filter:blur(2.5px)}
.single-phase.live{box-shadow:0 0 0 1px var(--c),0 20px 54px -30px var(--c);background:color-mix(in srgb,var(--c) 7%,var(--panel))}
.single-head{display:flex;align-items:center;justify-content:center;gap:.7em;width:100%}
.single-mark{border-color:var(--bronze);color:var(--bronze)}
.single-team{font-size:clamp(1.7rem,3.2vw,2.7rem);font-weight:600;color:var(--bronze);letter-spacing:.08em}
.single-phase .clock{font-size:clamp(4.2rem,13vw,9rem)}
.single-phase .bar span{background:var(--bronze);transform-origin:left center}
.single-phase.live .clock i.colon{animation:blink 1s steps(1,end) infinite}
.single-phase.w30 .clock{color:var(--warn)}
.single-phase.w5 .clock{color:var(--alarm);animation:throb .62s ease-in-out infinite alternate}
.single-phase.done .clock{color:var(--alarm)}
.single-phase.live .status{color:var(--bronze)}
.single-phase.done .status{color:var(--alarm)}
.guidance-note{margin:.15em 0 0;font-size:.88rem;letter-spacing:.16em;color:var(--ink-3);text-align:center}
.stage.single-mode{grid-template-columns:minmax(206px,248px) minmax(0,1fr);max-width:1180px;margin-left:auto;margin-right:auto}
.stage.single-mode .side{display:none}
.stage.single-mode .axis{grid-column:1;grid-row:1}
.stage.single-mode .single-phase{display:flex;grid-column:2;grid-row:1}

.hint{margin:.2em 0 0;padding-top:.8em;border-top:1px solid var(--line);font-size:.71rem;line-height:1.9;text-align:center;color:var(--ink-3)}
kbd{font-family:inherit;border:1px solid var(--line);border-radius:2px;padding:0 .32em;margin-inline:.1em}

@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.18}}
@keyframes throb{from{opacity:1}to{opacity:.55}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:940px){
  .stage{grid-template-columns:1fr}
  .axis{border-block:1px solid var(--line)}
  .axis::before,.axis::after{display:none}
  .motion{flex-wrap:wrap;justify-content:center}
  .stage.single-mode{grid-template-columns:1fr;max-width:none}
  .stage.single-mode .axis,.stage.single-mode .single-phase{grid-column:1;grid-row:auto}
}
</style>
</head>

<svg class="bg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <filter id="inkSoft" x="-20%" y="-20%" width="140%" height="140%">

    <section class="side" id="side-aff" data-side="aff">
      <div class="side-head">
        <span class="mark" aria-hidden="true">正</span>

      </div>
      <button class="clockbtn" id="btn-aff" type="button" aria-label="正方计时 开始或暂停">
        <span class="clock" id="clock-aff">17:00</span>
      </button>
      <div class="bar"><span id="bar-aff"></span></div>
      <p class="status" id="stat-aff"><span class="dot"></span>待命</p>
      <button class="time-edit" id="edit-aff" type="button">修改时间</button>
      <textarea class="stance" id="pos-aff" rows="2" placeholder="正方立场（可编辑）" aria-label="正方立场">大学新生更应该广泛尝试</textarea>
    </section>

    <section class="axis">
      <p class="axis-title">环节</p>
      <button class="pbtn" id="ph-p1" type="button" aria-pressed="true"><b>环节一 自由分配</b><em id="dur-p1">17:00</em></button>
      <button class="pbtn" id="ph-p3" type="button" aria-pressed="false"><b>环节二 场中指导</b><em id="dur-p3">2:00</em></button>
      <button class="pbtn" id="ph-p2" type="button" aria-pressed="false"><b>环节三 自由辩论</b><em id="dur-p2">4:00</em></button>
      <div class="row phase-main active" id="main-p1">
        <button class="main-btn" id="start-aff-main" type="button">开始正方</button>
        <button class="main-btn" id="start-neg-main" type="button">开始反方</button>
      </div>
      <button class="main-btn" id="switch-p2" type="button">切换计时</button>
      <button class="main-btn" id="main" type="button" data-state="paused">开始场中指导</button>

      <div class="row">
        <button class="mini" id="reset-phase" type="button">重置本环节</button>
        <button class="mini" id="reset-all" type="button">重置全场</button>
      </div>
      <div class="row">
        <button class="mini" id="test30" type="button">试听 30秒</button>
        <button class="mini" id="testend" type="button">试听 结束</button>
      </div>
      <div class="row">
        <button class="mini" id="full" type="button">全屏</button>
      </div>

      <p class="hint">
        <kbd>空格</kbd> 暂停／继续<br>
        <kbd>A</kbd>／<kbd>←</kbd> 正方计时 · <kbd>D</kbd>／<kbd>→</kbd> 反方计时（环节一／二）<br>

    </section>

    <section class="side" id="side-neg" data-side="neg">

  </main>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var DUR = { p1: 17 * 60 * 1000, p2: 4 * 60 * 1000, p3: 2 * 60 * 1000 };
  var SIDES = ["aff", "neg"];
  var PHASES = ["p1", "p2", "p3"];
  var PHASE_NAMES = { p1: "环节一 自由分配", p2: "环节二 自由辩论", p3: "环节三 场中指导" };
  var FIELDS = ["motion", "team-aff", "team-neg", "pos-aff", "pos-neg"];
  var KEY = "act6-debate-timer";

  var phase = "p1";
  var running = null;      // "aff" | "neg" | null
  var lastSide = "aff";
  var t0 = 0, r0 = 0, lastSave = 0;
  var base = { p1: { aff: DUR.p1, neg: DUR.p1 }, p2: { aff: DUR.p2, neg: DUR.p2 }, p3: { guide: DUR.p3 } };
  var rem = { p1: { aff: DUR.p1, neg: DUR.p1 }, p2: { aff: DUR.p2, neg: DUR.p2 }, p3: { guide: DUR.p3 } };
  var fired = { p1: { aff: {}, neg: {} }, p2: { aff: {}, neg: {} }, p3: { guide: {} } };
  function actors(p) { return p === "p3" ? ["guide"] : SIDES; }

  /* ── 声音：赛场铜铃（清脆的铃头 + 有重量的低频钟体） ── */
  var ac = null, master = null, comp = null;
  function audio() {
    try {
      if (!ac) {
        var C = window.AudioContext || window.webkitAudioContext;
        if (!C) return null;
        ac = new C();
        master = ac.createGain();
        master.gain.value = 0.90;
        comp = ac.createDynamicsCompressor();
        comp.threshold.value = -22;
        comp.knee.value = 18;
        comp.ratio.value = 5.5;
        comp.attack.value = 0.002;
        comp.release.value = 0.18;
        master.connect(comp);
        comp.connect(ac.destination);
      }
      if (ac.state === "suspended") ac.resume();
      return ac;
    } catch (e) { return null; }
  }

  function tone(a, t, freq, type, gain, attack, decay) {
    var o = a.createOscillator();
    var g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + decay + 0.04);
  }

  function attackClick(a, t, strength) {
    /* 极短的金属击打瞬态，让第一下在嘈杂赛场里也能“立起来” */
    var len = Math.max(1, Math.floor(a.sampleRate * 0.020));
    var buf = a.createBuffer(1, len, a.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < len; i++) {
      var x = i / len;
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - x, 4);
    }
    var src = a.createBufferSource();
    var hp = a.createBiquadFilter();
    var g = a.createGain();
    hp.type = "highpass";
    hp.frequency.value = 2800;
    hp.Q.value = 0.9;
    g.gain.value = 0.23 * strength;
    src.buffer = buf;
    src.connect(hp); hp.connect(g); g.connect(master);
    src.start(t);
  }

  function bellStrike(when, strength) {
    var a = audio(); if (!a) return;
    var t = a.currentTime + when;
    var s = strength || 1;

    /* 保留有分量的钟体，但把能量让给更清楚的金属铃头 */
    tone(a, t, 196.00, "triangle", 0.29 * s, 0.002, 0.31);
    tone(a, t, 329.63, "sine",     0.16 * s, 0.002, 0.25);

    /* 更脆的铜铃泛音：主击更亮、尾音更短，穿透人声但不变成电子蜂鸣 */
    tone(a, t, 1046.50, "sine", 0.62 * s, 0.0015, 0.92);
    tone(a, t, 2115.00, "sine", 0.38 * s, 0.0015, 0.70);
    tone(a, t, 3190.00, "sine", 0.27 * s, 0.0015, 0.53);
    tone(a, t, 4725.00, "sine", 0.17 * s, 0.0015, 0.38);
    tone(a, t, 6810.00, "sine", 0.085 * s, 0.0015, 0.25);
    attackClick(a, t, s);
  }

  function cue(kind) {
    if (kind === 30) {
      bellStrike(0, 1.00);
    } else if (kind === "end") {
      bellStrike(0, 1.08);
      bellStrike(0.23, 1.08);
    }
  }

  /* ── 计时核心 ── */
  function left(side) {
    if (running === side) return Math.max(0, r0 - (performance.now() - t0));
    return rem[phase][side];
  }
  function commit() {
    if (!running) return;
    rem[phase][running] = Math.max(0, r0 - (performance.now() - t0));
  }
  function start(side) {
    if (running === side) { pause(); return; }
    audio();
    if (running) commit();
    if (rem[phase][side] <= 0) { running = null; render(); return; }
    running = side; lastSide = side;
    r0 = rem[phase][side]; t0 = performance.now();
    render(); save();
  }
  function pause() { commit(); running = null; render(); save(); }
  function toggle() {
    if (running) pause();
    else start(phase === "p3" ? "guide" : (lastSide === "guide" ? "aff" : lastSide));
  }
  function switchP2() {
    if (phase !== "p2") return;
    var target;
    if (running === "aff") target = "neg";
    else if (running === "neg") target = "aff";
    else {
      var untouched = rem.p2.aff === base.p2.aff && rem.p2.neg === base.p2.neg;
      target = untouched ? "aff" : (lastSide === "aff" ? "neg" : "aff");
    }
    if (rem.p2[target] <= 0) {
      if (running) pause();
      return;
    }
    start(target);
  }
  function setPhase(p) {
    if (p === phase) return;
    commit(); running = null; phase = p;
    if (phase === "p3") lastSide = "guide";
    else if (phase === "p2") lastSide = "aff";
    else if (lastSide === "guide") lastSide = "aff";
    render(); save();
  }
  function resetPhase() {
    var suffix = phase === "p3" ? "计时？" : "双方时间？";
    if (!window.confirm("重置「" + PHASE_NAMES[phase] + "」" + suffix)) return;
    running = null;
    if (phase === "p3") {
      rem.p3 = { guide: base.p3.guide };
      fired.p3 = { guide: {} };
    } else {
      rem[phase] = { aff: base[phase].aff, neg: base[phase].neg };
      fired[phase] = { aff: {}, neg: {} };
    }
    render(); save();
  }
  function resetAll() {
    if (!window.confirm("重置全场三个环节的时间？")) return;
    running = null;
    rem = {
      p1: { aff: base.p1.aff, neg: base.p1.neg },
      p2: { aff: base.p2.aff, neg: base.p2.neg },
      p3: { guide: base.p3.guide }
    };
    fired = { p1: { aff: {}, neg: {} }, p2: { aff: {}, neg: {} }, p3: { guide: {} } };
    render(); save();
  }

  /* ── 渲染 ── */
  function paint(el, ms) {
    var total = Math.max(0, Math.ceil(ms / 1000));
    var mins = String(Math.floor(total / 60));
    if (mins.length < 2) mins = "0" + mins;
    var s = mins + ":" + ("0" + (total % 60)).slice(-2);
    if (el.dataset.v === s) return;
    el.dataset.v = s;
    var out = "";
    for (var i = 0; i < s.length; i++) {
      out += s[i] === ":" ? '<i class="colon">:</i>' : "<i>" + s[i] + "</i>";
    }
    el.innerHTML = out;
  }
  function renderSide(side) {
    var v = left(side);
    var box = $("side-" + side);
    paint($("clock-" + side), v);
    var cap = Math.max(1, base[phase][side]);
    $("bar-" + side).style.transform = "scaleX(" + Math.max(0, Math.min(1, v / cap)) + ")";
    box.classList.toggle("live", running === side);
    box.classList.toggle("done", v <= 0);
    box.classList.toggle("w30", v > 5000 && v <= 30000);
    box.classList.toggle("w5", v > 0 && v <= 5000);
    var label = v <= 0 ? "时间用尽" : running === side ? "计时中" : rem[phase][side] < base[phase][side] ? "暂停" : "待命";
    var stat = $("stat-" + side);
    if (stat.dataset.v !== label) { stat.dataset.v = label; stat.innerHTML = '<span class="dot"></span>' + label; }
  }
  function renderGuide() {
    var v = left("guide");
    var box = $("single-phase");
    paint($("clock-guide"), v);
    var cap = Math.max(1, base.p3.guide);
    $("bar-guide").style.transform = "scaleX(" + Math.max(0, Math.min(1, v / cap)) + ")";
    box.classList.toggle("live", running === "guide");
    box.classList.toggle("done", v <= 0);
    box.classList.toggle("w30", v > 5000 && v <= 30000);
    box.classList.toggle("w5", v > 0 && v <= 5000);
    var label = v <= 0 ? "时间用尽" : running === "guide" ? "计时中" : rem.p3.guide < base.p3.guide ? "暂停" : "待命";
    var stat = $("stat-guide");
    if (stat.dataset.v !== label) { stat.dataset.v = label; stat.innerHTML = '<span class="dot"></span>' + label; }
  }
  function phaseDurationLabel(p) {
    if (p === "p3") return formatInputTime(base.p3.guide);
    if (base[p].aff === base[p].neg) return formatInputTime(base[p].aff);
    return "自定义";
  }
  function render() {
    var single = phase === "p3";
    $("stage").classList.toggle("single-mode", single);
    if (single) renderGuide(); else SIDES.forEach(renderSide);
    $("dur-p1").textContent = phaseDurationLabel("p1");
    $("dur-p2").textContent = phaseDurationLabel("p2");
    $("dur-p3").textContent = phaseDurationLabel("p3");
    PHASES.forEach(function (p) { $("ph-" + p).setAttribute("aria-pressed", String(phase === p)); });
    var p1Controls = $("main-p1");
    var p2Switch = $("switch-p2");
    var m = $("main");
    p1Controls.classList.toggle("active", phase === "p1");
    p2Switch.classList.toggle("active", phase === "p2");
    m.classList.toggle("active", phase === "p3");

    if (phase === "p1") {
      $("start-aff-main").textContent = "开始正方";
      $("start-neg-main").textContent = "开始反方";
    } else if (phase === "p2") {
      p2Switch.textContent = "切换计时";
      p2Switch.dataset.state = running ? "running" : "paused";
    } else {
      m.dataset.state = running ? "running" : "paused";
      if (running === "guide") m.textContent = "暂停";
      else if (rem.p3.guide <= 0) m.textContent = "本环节时间已用尽";
      else m.textContent = "开始场中指导";
    }
  }

  function tick() {
    if (!running) return;
    var side = running, v = left(side), f = fired[phase][side];
    if (v <= 30000 && !f.w30) { f.w30 = 1; cue(30); }
    if (v <= 0) {
      if (!f.end) { f.end = 1; cue("end"); }
      commit(); running = null; render(); save(); return;
    }
    if (phase === "p3") renderGuide(); else renderSide(side);
    var n = Date.now();
    if (n - lastSave > 1000) { lastSave = n; save(); }
  }
  setInterval(tick, 80);

  /* ── 存档 ── */
  var saveTimer = null;
  function save() {
    try {
      var f = {};
      FIELDS.forEach(function (id) { f[id] = $(id).value; });
      var snap = JSON.parse(JSON.stringify(rem));
      if (running) snap[phase][running] = left(running);
      localStorage.setItem(KEY, JSON.stringify({
        f: f, phase: phase, base: base, rem: snap, fired: fired, ts: Date.now()
      }));
    } catch (e) { /* 隐私模式下忽略 */ }
  }
  function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 400); }
  function load() {
    var s = null;
    try { s = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { return; }
    if (!s) return;
    if (s.f) FIELDS.forEach(function (id) { if (typeof s.f[id] === "string") $(id).value = s.f[id]; });
    var maxTime = 24 * 60 * 60 * 1000;
    if (s.base) {
      ["p1", "p2"].forEach(function (p) {
        if (s.base[p] && SIDES.every(function (k) { return typeof s.base[p][k] === "number" && s.base[p][k] > 0 && s.base[p][k] <= maxTime; })) {
          base[p] = { aff: s.base[p].aff, neg: s.base[p].neg };
        }
      });
      if (s.base.p3 && typeof s.base.p3.guide === "number" && s.base.p3.guide > 0 && s.base.p3.guide <= maxTime) base.p3.guide = s.base.p3.guide;
    }

    if (s.rem && s.ts && Date.now() - s.ts < 8 * 3600 * 1000) {
      ["p1", "p2"].forEach(function (p) {
        if (s.rem[p] && SIDES.every(function (k) { return typeof s.rem[p][k] === "number" && s.rem[p][k] >= 0 && s.rem[p][k] <= maxTime; })) {
          rem[p] = { aff: s.rem[p].aff, neg: s.rem[p].neg };
        }
      });
      if (s.rem.p3 && typeof s.rem.p3.guide === "number" && s.rem.p3.guide >= 0 && s.rem.p3.guide <= maxTime) rem.p3.guide = s.rem.p3.guide;
      if (s.fired) {
        if (s.fired.p1) fired.p1 = s.fired.p1;
        if (s.fired.p2) fired.p2 = s.fired.p2;
        if (s.fired.p3 && s.fired.p3.guide) fired.p3 = s.fired.p3;
      }
      if (PHASES.indexOf(s.phase) !== -1) phase = s.phase;
      lastSide = phase === "p3" ? "guide" : "aff";
    }
  }

  function formatInputTime(ms) {
    var total = Math.max(0, Math.round(ms / 1000));
    return Math.floor(total / 60) + ":" + ("0" + (total % 60)).slice(-2);
  }
  function parseInputTime(value) {
    var v = String(value || "").trim();
    var m = v.match(/^(\d{1,4})(?::([0-5]\d))?$/);
    if (!m) return null;
    var mins = Number(m[1]);
    var secs = m[2] == null ? 0 : Number(m[2]);
    var ms = (mins * 60 + secs) * 1000;
    return ms > 0 && ms <= 24 * 60 * 60 * 1000 ? ms : null;
  }
  function editTime(side) {
    if (running) pause();
    var current = rem[phase][side];
    var label = side === "guide" ? "场中指导" : (side === "aff" ? "正方" : "反方");
    var val = window.prompt("设置" + label + "本环节时间（格式 MM:SS，例如 15:00 或 3:30）", formatInputTime(current));
    if (val === null) return;
    var ms = parseInputTime(val);
    if (ms === null) {
      window.alert("时间格式不正确。请输入例如 15:00、3:30 或 8（表示 8 分钟）。");
      return;
    }
    base[phase][side] = ms;
    rem[phase][side] = ms;
    fired[phase][side] = {};
    lastSide = side;
    render(); save();
  }

  /* 辩题/立场文本自动增高：字号更大，但长辩题最多可展开约5行，不会被裁掉 */
  function fitStance(el) {
    if (!el) return;
    el.style.height = "auto";
    var cs = window.getComputedStyle(el);
    var lh = parseFloat(cs.lineHeight) || 24;
    var pad = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
    var maxH = lh * 5 + pad + 4;
    var h = Math.min(el.scrollHeight, maxH);
    el.style.height = h + "px";
    el.style.overflowY = el.scrollHeight > maxH ? "auto" : "hidden";
  }

  /* ── 交互 ── */
  SIDES.forEach(function (side) {
    $("btn-" + side).addEventListener("click", function () { start(side); });
    $("edit-" + side).addEventListener("click", function () { editTime(side); });
  });
  $("btn-guide").addEventListener("click", function () { start("guide"); });
  $("edit-guide").addEventListener("click", function () { editTime("guide"); });
  $("start-aff-main").addEventListener("click", function () { start("aff"); });
  $("start-neg-main").addEventListener("click", function () { start("neg"); });
  $("switch-p2").addEventListener("click", switchP2);
  $("main").addEventListener("click", toggle);
  $("ph-p1").addEventListener("click", function () { setPhase("p1"); });
  $("ph-p2").addEventListener("click", function () { setPhase("p2"); });
  $("ph-p3").addEventListener("click", function () { setPhase("p3"); });
  $("reset-phase").addEventListener("click", resetPhase);
  $("reset-all").addEventListener("click", resetAll);
  $("test30").addEventListener("click", function () { audio(); cue(30); });
  $("testend").addEventListener("click", function () { audio(); cue("end"); });
  var full = $("full");
  if (!document.fullscreenEnabled) { full.style.display = "none"; }
  full.addEventListener("click", function () {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    } catch (e) { /* 宿主不允许全屏时忽略 */ }
  });
  document.addEventListener("fullscreenchange", function () {
    full.textContent = document.fullscreenElement ? "退出全屏" : "全屏";
  });

  FIELDS.forEach(function (id) {
    $(id).addEventListener("input", function () {
      saveSoon();
      if (id.indexOf("team-") === 0) render();
      if (id === "pos-aff" || id === "pos-neg") fitStance(this);
    });
  });

  document.addEventListener("keydown", function (e) {
    var t = e.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) {
      if (e.key === "Escape") t.blur();
      return;
    }
    var k = e.key.toLowerCase();
    if (e.code === "Space" || k === " ") { e.preventDefault(); toggle(); }
    else if ((k === "a" || k === "arrowleft") && phase !== "p3") { e.preventDefault(); start("aff"); }
    else if ((k === "d" || k === "arrowright") && phase !== "p3") { e.preventDefault(); start("neg"); }
    else if (k === "1") setPhase("p1");
    else if (k === "2") setPhase("p2");
    else if (k === "3") setPhase("p3");
    else if (k === "f") full.click();
  });

  window.addEventListener("beforeunload", function () { commit(); save(); });

  load();
  fitStance($("pos-aff"));
  fitStance($("pos-neg"));
  render();
})();
</script>
</body>
</html>
